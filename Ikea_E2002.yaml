blueprint:
  name: IKEA E2002 – sekwencyjne włączanie/wyłączanie lamp (Zigbee2MQTT)
  description: >
    Ten blueprint umożliwia sekwencyjne włączanie i wyłączanie lamp przy użyciu przełącznika IKEA E2002,
    zintegrowanego przez Zigbee2MQTT. Komunikat MQTT powinien być w formacie JSON i zawierać pole `action`
    z wartością:
      - on – wciśnięcie górnej ikony,
      - off – wciśnięcie dolnej ikony,
      - brightness_move_up – przytrzymanie górnej ikony,
      - brightness_move_down – przytrzymanie dolnej ikony.
    Automatyzacja korzysta z pomocniczej encji (input_number) do przechowywania liczby włączonych lamp.
  domain: automation
  input:
    mqtt_topic:
      name: Temat MQTT
      description: Temat, na którym nasłuchujemy wiadomości z Zigbee2MQTT.
      default: "zigbee2mqtt/ikea_e2002"
      selector:
        text: {}
    lamp_sequence:
      name: Kolejność lamp
      description: Lista encji typu light, które mają być sterowane kolejno.
      default:
        entity_id: []  # W konfiguracji wybierz co najmniej jedną lampę!
      selector:
        target:
          entity:
            domain: light
    helper_state:
      name: Helper sekwencji
      description: Encja pomocnicza (input_number) przechowująca liczbę aktualnie włączonych lamp. Ustaw wartość początkową na 0.
      selector:
        entity:
          domain: input_number

trigger:
  - platform: mqtt
    topic: !input mqtt_topic

action:
  - choose:
      # Blok dla akcji "on" – sekwencyjne włączanie lamp
      - conditions:
          - condition: template
            value_template: "{{ trigger.payload_json.action == 'on' }}"
        sequence:
          - variables:
              helper: !input helper_state
              current_on: "{{ states(helper) | int }}"
              total: "{{ (lamp_sequence.entity_id) | length }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ current_on < total }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: "{{ (lamp_sequence.entity_id)[current_on] }}"
                  - service: input_number.set_value
                    target:
                      entity_id: "{{ helper }}"
                    data:
                      value: "{{ current_on + 1 }}"
            default:
              - service: persistent_notification.create
                data:
                  title: "IKEA E2002"
                  message: "Wszystkie lampy są już włączone."
      # Blok dla akcji "off" – sekwencyjne wyłączanie lamp (w odwrotnej kolejności)
      - conditions:
          - condition: template
            value_template: "{{ trigger.payload_json.action == 'off' }}"
        sequence:
          - variables:
              helper: !input helper_state
              current_on: "{{ states(helper) | int }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ current_on > 0 }}"
                sequence:
                  - variables:
                      index_to_turn_off: "{{ current_on - 1 }}"
                  - service: light.turn_off
                    target:
                      entity_id: "{{ (lamp_sequence.entity_id)[index_to_turn_off] }}"
                  - service: input_number.set_value
                    target:
                      entity_id: "{{ helper }}"
                    data:
                      value: "{{ current_on - 1 }}"
            default:
              - service: persistent_notification.create
                data:
                  title: "IKEA E2002"
                  message: "Brak włączonych lamp do wyłączenia."
      # Blok dla akcji hold "brightness_move_up" – ustawienie wszystkich lamp na 100% jasności
      - conditions:
          - condition: template
            value_template: "{{ trigger.payload_json.action == 'brightness_move_up' }}"
        sequence:
          - service: light.turn_on
            data:
              brightness_pct: 100
            target:
              entity_id: "{{ lamp_sequence.entity_id }}"
      # Blok dla akcji hold "brightness_move_down" – wyłączenie wszystkich lamp
      - conditions:
          - condition: template
            value_template: "{{ trigger.payload_json.action == 'brightness_move_down' }}"
        sequence:
          - service: light.turn_off
            target:
              entity_id: "{{ lamp_sequence.entity_id }}"
    default: []
